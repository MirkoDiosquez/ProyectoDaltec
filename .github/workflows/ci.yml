name: CI — Test & Lint

on:
  push:
    branches: [main, develop, "003-mejoras-hallazgos", "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # -------------------------------------------------------------------------
  # Backend: lint + tests
  # -------------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: daltec_test
          MYSQL_USER: daltec_user
          MYSQL_PASSWORD: daltec_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DJANGO_SETTINGS_MODULE: config.settings.development
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: daltec_test
      MYSQL_USER: daltec_user
      MYSQL_PASSWORD: daltec_password
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      MAX_FILE_SIZE: "10485760"
      LOG_LEVEL: "WARNING"
      LOG_FORMAT: "text"
      LOG_ROOT: "/tmp/daltec-logs"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u daltec_user --password=daltec_password --silent && break
            echo "Waiting for MySQL ($i/30)..."
            sleep 2
          done

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Load catalog fixtures
        run: python manage.py loaddata apps/catalogos/fixtures/catalogs.json

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # -------------------------------------------------------------------------
  # Frontend: lint + tests + build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run --coverage

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.daltec.prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
